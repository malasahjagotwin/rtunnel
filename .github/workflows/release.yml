name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w" -o agent-${{ matrix.goos }}-${{ matrix.goarch }} ./agent
          go build -trimpath -ldflags "-s -w" -o client-${{ matrix.goos }}-${{ matrix.goarch }} ./client
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            agent-${{ matrix.goos }}-${{ matrix.goarch }}
            client-${{ matrix.goos }}-${{ matrix.goarch }}
